name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_check:
        description: "Run the live check against the real database (only while it needs setup)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive (unsigned)
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild -project AlSiddiq.xcodeproj -scheme AlSiddiq -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/AlSiddiq.xcarchive archive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            2>&1 | tee build.log | grep -E "error:|ARCHIVE SUCCEEDED|ARCHIVE FAILED|BUILD FAILED" || true
          grep -E "error:" build.log | sort -u | head -60 > errors.txt || true
          head -40 errors.txt | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
          test -d build/AlSiddiq.xcarchive/Products/Applications/AlSiddiq.app
          grep -q "ARCHIVE SUCCEEDED" build.log
      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R build/AlSiddiq.xcarchive/Products/Applications/AlSiddiq.app out/Payload/
          cd out && zip -qry AlSiddiq_unsigned.ipa Payload && ls -la AlSiddiq_unsigned.ipa
          unzip -l AlSiddiq_unsigned.ipa | head -20
      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: AlSiddiq_unsigned
          path: out/AlSiddiq_unsigned.ipa
          compression-level: 0
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            errors.txt
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch errors.txt build.log
          tail -c 200000 build.log > build_tail.log
          gh release create "fail-${{ github.run_number }}" errors.txt build_tail.log --repo "${{ github.repository }}" --prerelease \
            --title "failed build ${{ github.run_number }}" --notes "compile errors of run ${{ github.run_number }}" || true

  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 15 Pro')] or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'])")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
      - name: Build for simulator
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild -project AlSiddiq.xcodeproj -scheme AlSiddiq -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath dd build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            2>&1 | tee sim.log | grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" || true
          grep -q "BUILD SUCCEEDED" sim.log
      - name: Shoot
        timeout-minutes: 25
        run: bash ci/shots.sh "${{ steps.sim.outputs.udid }}"
      - name: Shoot (iPhone SE and 6.7-inch)
        if: always()
        timeout-minutes: 22
        run: bash ci/shots_sizes.sh "${{ steps.sim.outputs.udid }}"
      - name: Unit tests (offline sync against a mock server)
        if: always()
        timeout-minutes: 15
        run: |
          mkdir -p shots
          xcodebuild test -project AlSiddiq.xcodeproj -scheme AlSiddiq -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath dd -only-testing:AlSiddiqTests \
            CODE_SIGNING_ALLOWED=NO SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" > shots/unit_tests.log 2>&1 || true
          grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)" shots/unit_tests.log | tail -40 > shots/unit_tests.txt || true
          cat shots/unit_tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

  live:
    if: ${{ inputs.live_check }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 15 Pro')] or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'])")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
      - name: Build for testing (Debug, real database)
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project AlSiddiq.xcodeproj -scheme AlSiddiq -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath dd \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO SUPABASE_URL="$SUPABASE_URL" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            2>&1 | tee live_build.log | grep -E "error:|TEST BUILD SUCCEEDED|BUILD FAILED" || true
          grep -hE "error:" live_build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
          grep -q "SUCCEEDED" live_build.log
      - name: Live check
        timeout-minutes: 30
        run: bash ci/cloud_check.sh "${{ steps.sim.outputs.udid }}"
      - name: Publish live results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p shots; touch shots/cloud_selftest.txt
          gh release create "live-${{ github.run_number }}" shots/*.png shots/*.txt shots/uitest.log --repo "${{ github.repository }}" --prerelease \
            --title "live check ${{ github.run_number }}" --notes "Live check against the real database (throwaway rows, removed after)." || true

  release:
    needs: [ipa, screenshots]
    if: always() && needs.ipa.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Contact sheet + small copies of the screens
        if: always()
        run: |
          mkdir -p art/screenshots
          python3 -m pip install --quiet pillow || pip3 install --quiet pillow || true
          python3 - <<'PY' || true
          import os, zipfile
          from PIL import Image, ImageDraw
          d = "art/screenshots"
          order = ["00b_splash","00_password","01_viewer_home","18_tools_menu","18a_tool_mushaf","18b_tool_prayer",
                   "20_themes_picker","21_theme_emerald","22_theme_night_teacher","24_occasion_ramadan_popup","29_occasion_sep26_popup","31_occasion_picker_locked",
                   "32_about","33_about_admin","34_developer","10_admin_teachers","09_admin_passwords","11_admin_circles",
                   "12_teacher_home","13_teacher_circle","14_teacher_record","35_offline_pending_home","36_offline_pending_history","37_admin_circle_edit_fee","38_viewer_circle_fee"]
          have = [n for n in order if os.path.exists(f"{d}/{n}.png")]
          w, cols = 320, 5
          ims = [Image.open(f"{d}/{n}.png").convert("RGB") for n in have]
          if ims:
              h = int(ims[0].height * w / ims[0].width)
              sheet = Image.new("RGB", (cols * w, ((len(ims) + cols - 1) // cols) * (h + 22)), "white")
              dr = ImageDraw.Draw(sheet)
              for k, (n, im) in enumerate(zip(have, ims)):
                  x, y = (k % cols) * w, (k // cols) * (h + 22)
                  sheet.paste(im.resize((w, h)), (x, y + 22))
                  dr.text((x + 6, y + 5), n, fill="black")
              sheet.save(f"{d}/ios_screens_v3.jpg", quality=82)
          with zipfile.ZipFile(f"{d}/shots_small.zip", "w") as z:
              for f in sorted(os.listdir(d)):
                  if f.endswith(".png"):
                      im = Image.open(f"{d}/{f}").convert("RGB"); im.thumbnail((420, 920)); im.save("/tmp/s.jpg", quality=80)
                      z.write("/tmp/s.jpg", f[:-4] + ".jpg")
          print("sheet:", len(have), "screens")
          # the 8 Nov changes: their own small sheets (iPhone SE / 6.7-inch screens scaled to the same width)
          def small_sheet(order, name, w2=300, cols2=5):
              have2 = [n for n in order if os.path.exists(f"{d}/{n}.png")]
              if not have2: return
              ims2 = [Image.open(f"{d}/{n}.png").convert("RGB") for n in have2]
              hs = [int(im.height * w2 / im.width) for im in ims2]
              rows = [list(range(i, min(i + cols2, len(ims2)))) for i in range(0, len(ims2), cols2)]
              rh = [max(hs[k] for k in r) + 24 for r in rows]
              sheet2 = Image.new("RGB", (cols2 * w2 + (cols2 - 1) * 8, sum(rh)), "white")
              dr2 = ImageDraw.Draw(sheet2)
              y = 0
              for r, hrow in zip(rows, rh):
                  for j, k in enumerate(r):
                      x = j * (w2 + 8)
                      sheet2.paste(ims2[k].resize((w2, hs[k])), (x, y + 24))
                      tag = "  (iPhone SE)" if "_se_" in have2[k] else ("  (6.7in)" if "_67_" in have2[k] else "")
                      dr2.text((x + 6, y + 6), have2[k] + tag, fill="black")
                  y += hrow
              sheet2.save(f"{d}/{name}", quality=84)
              print(name, len(have2), "screens")
          small_sheet(["40_admin_home_bar","41_teacher_home_bar","42_viewer_home_bar","43_tools_tab_admin","46_tools_tab_tool_open",
                       "44_tools_tab_teacher","45_tools_tab_viewer","47_tools_tab_night","49_tools_tab_grid","00_password","48_password_tools_below","74_67_tools_tab",
                       "50_se_admin_home","51_se_teacher_home","52_se_viewer_home","53_se_tools_tab","55_se_tools_tab_grid","56_se_password_tools",
                       "03_role_login_admin","07_admin_home","12_teacher_home","01_viewer_home",
                       "98_tasbeeh_v2_open1","98b_tasbeeh_v2_open2","99_asma_v2_open1","99b_asma_v2_open2"], "ios_tabs_fix.jpg")
          small_sheet(["60_se_mushaf_p1","61_se_mushaf_p3","62_se_mushaf_p552","80_mushaf_p1","81_mushaf_p3","82_mushaf_p552",
                       "70_67_mushaf_p1","71_67_mushaf_p3","72_67_mushaf_p552","73_67_mushaf_p3_bigger",
                       "85_hifz_recite_start","86_hifz_recite_progress","63_se_hifz_recite"], "ios_mushaf_hifz.jpg", cols2=5)
          small_sheet(["90_admin_home_bell","91_admin_events","92_admin_event_card","93_teacher_student_edit_dismiss",
                       "94_honors_viewer","95_honor_publish","96_honor_greeting"], "ios_students_honors.jpg", cols2=4)
          PY
          ls -la art/screenshots | tail -5
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R art | head -60
          TAG=build-${{ github.run_number }}
          FILES="art/AlSiddiq_unsigned/AlSiddiq_unsigned.ipa art/build-log/build.log"
          if [ -d art/screenshots ]; then FILES="$FILES $(ls art/screenshots/*.png art/screenshots/*.jpg art/screenshots/*.zip art/screenshots/*.txt 2>/dev/null | tr '\n' ' ')"; fi
          MODE="demo data (no central database configured)"
          if [ -n "$SUPABASE_URL" ]; then MODE="central database: $SUPABASE_URL"; fi
          gh release create "$TAG" art/AlSiddiq_unsigned/AlSiddiq_unsigned.ipa --repo "${{ github.repository }}" --title "مركز الصديق iOS — build ${{ github.run_number }}" \
            --notes "Unsigned .ipa (sign it yourself). Data: $MODE. Commit ${{ github.sha }}."
          # the rest one by one, so one bad file can't stop the others (an empty file is skipped)
          for f in $FILES; do
            [ -s "$f" ] || { echo "skip empty $f"; continue; }
            [ "$f" = "art/AlSiddiq_unsigned/AlSiddiq_unsigned.ipa" ] && continue
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber > /dev/null 2>&1 || echo "::warning::upload failed: $f"
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets | length'
