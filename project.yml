name: AlSiddiq
options:
  bundleIdPrefix: com.alsiddiq
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
packages:
  Adhkar:
    path: Packages/Adhkar
  Duas:
    path: Packages/Duas
  Tasbeeh:
    path: Packages/Tasbeeh
  AsmaAllah:
    path: Packages/AsmaAllah
targets:
  AlSiddiq:
    type: application
    platform: iOS
    sources:
      - path: AlSiddiq
    dependencies:
      - package: Adhkar
      - package: Duas
      - package: Tasbeeh
      - package: AsmaAllah
    info:
      path: AlSiddiq/Info.plist
      properties:
        CFBundleDisplayName: "مركز الصديق"
        CFBundleName: "AlSiddiq"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchLogo
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "لالتقاط صورة الطالب وإضافتها إلى ملفه"
        NSPhotoLibraryUsageDescription: "لاختيار صورة الطالب من الصور"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.alsiddiq.app.refresh]
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alsiddiq.app
        PRODUCT_NAME: AlSiddiq
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        DEBUG_INFORMATION_FORMAT: dwarf
        OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-expression-type-checking=400 -Xfrontend -warn-long-function-bodies=1200"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      testTargets:
        - AlSiddiqUITests
  AlSiddiqUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AlSiddiqUITests
    dependencies:
      - target: AlSiddiq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.alsiddiq.app.uitests
        TEST_TARGET_NAME: AlSiddiq
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
