name: AlSiddiq
options:
  bundleIdPrefix: com.alsiddiq
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ar
targets:
  AlSiddiq:
    type: application
    platform: iOS
    sources:
      - path: AlSiddiq
    info:
      path: AlSiddiq/Info.plist
      properties:
        CFBundleDisplayName: "مركز الصديق"
        CFBundleName: "AlSiddiq"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBG
          UIImageName: LaunchLogo
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alsiddiq.app
        PRODUCT_NAME: AlSiddiq
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        DEBUG_INFORMATION_FORMAT: dwarf
        OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-expression-type-checking=400 -Xfrontend -warn-long-function-bodies=1200"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    scheme: {}
